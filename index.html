<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="أداتي - أدوات مجانية وسريعة للنصوص وكلمات المرور وغيرها.">
  <meta name="theme-color" content="#0f766e">
  <title>أداتي - أدوات مجانية</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="container nav">
    <div class="logo">أداتي</div>
    <div class="tagline">أدواتك اليومية في مكان واحد</div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <span class="badge">⚡ مجانية وسريعة</span>
    <h1>أدوات بسيطة، إنجاز أسرع</h1>
    <p>مجموعة من الأدوات المفيدة التي تعمل مباشرة من المتصفح.</p>
  </section>

  <section class="tools-grid">

    <button class="tool-card" onclick="openTool('counter')">
      <span class="tool-icon">📝</span>
      <h2>عداد الكلمات والحروف</h2>
      <p>احسب الكلمات والحروف والمسافات في النص.</p>
    </button>

    <button class="tool-card" onclick="openTool('cleaner')">
      <span class="tool-icon">🧹</span>
      <h2>تنظيف النص</h2>
      <p>نظف النص من المسافات والأسطر الزائدة.</p>
    </button>

    <button class="tool-card" onclick="openTool('case')">
      <span class="tool-icon">🔠</span>
      <h2>تحويل الأحرف</h2>
      <p>حوّل النص الإنجليزي إلى كبير أو صغير.</p>
    </button>

    <button class="tool-card" onclick="openTool('password')">
      <span class="tool-icon">🔐</span>
      <h2>مولد كلمات المرور</h2>
      <p>أنشئ كلمة مرور قوية وعشوائية.</p>
    </button>

  </section>

  <section id="toolArea" class="tool-area hidden">

    <button class="back-btn" onclick="closeTool()">← العودة للأدوات</button>

    <div id="counterTool" class="tool hidden">
      <h2>📝 عداد الكلمات والحروف</h2>
      <textarea id="counterText" placeholder="اكتب أو الصق النص هنا..."></textarea>

      <div class="stats">
        <div><strong id="words">0</strong><span>كلمات</span></div>
        <div><strong id="chars">0</strong><span>حروف</span></div>
        <div><strong id="noSpaces">0</strong><span>بدون مسافات</span></div>
      </div>

      <div class="actions">
        <button onclick="copyText('counterText')">نسخ</button>
        <button onclick="clearText('counterText')">مسح</button>
      </div>
    </div>

    <div id="cleanerTool" class="tool hidden">
      <h2>🧹 تنظيف النص</h2>
      <textarea id="cleanText" placeholder="ضع النص الذي تريد تنظيفه هنا..."></textarea>

      <div class="actions">
        <button onclick="cleanText()">تنظيف النص</button>
        <button onclick="copyText('cleanText')">نسخ</button>
        <button onclick="clearText('cleanText')">مسح</button>
      </div>
    </div>

    <div id="caseTool" class="tool hidden">
      <h2>🔠 تحويل الأحرف الإنجليزية</h2>
      <textarea id="caseText" placeholder="اكتب النص الإنجليزي هنا..."></textarea>

      <div class="actions">
        <button onclick="changeCase('upper')">UPPERCASE</button>
        <button onclick="changeCase('lower')">lowercase</button>
        <button onclick="copyText('caseText')">نسخ</button>
      </div>
    </div>

    <div id="passwordTool" class="tool hidden">
      <h2>🔐 مولد كلمات المرور</h2>

      <div class="password-box">
        <input id="passwordResult" readonly value="">
        <button onclick="generatePassword()">توليد</button>
      </div>

      <label class="range-label">
        طول كلمة المرور:
        <strong id="lengthValue">16</strong>
      </label>

      <input
        id="passwordLength"
        type="range"
        min="6"
        max="40"
        value="16"
        oninput="updateLength()"
      >

      <div class="password-options">
        <label><input type="checkbox" id="upper" checked> أحرف كبيرة</label>
        <label><input type="checkbox" id="lower" checked> أحرف صغيرة</label>
        <label><input type="checkbox" id="numbers" checked> أرقام</label>
        <label><input type="checkbox" id="symbols" checked> رموز</label>
      </div>
    </div>

  </section>

</main>

<footer>
  <div class="container">
    © 2026 أداتي — أدوات مجانية للجميع
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
