<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداتي - أدوات مجانية</title>
<meta name="description" content="أداتي - أدوات مجانية وسريعة للجميع">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">أداتي</div>
    <div class="subtitle">أدوات بسيطة، سريعة ومجانية</div>
</header>

<main>
    <section class="hero">
        <span class="badge">أداة مجانية</span>
        <h1>عداد الكلمات والحروف</h1>
        <p>اكتب أو الصق النص واحصل على الإحصائيات فورًا.</p>
    </section>

    <section class="card">
        <textarea id="text" placeholder="اكتب النص هنا..."></textarea>

        <div class="stats">
            <div>
                <strong id="words">0</strong>
                <span>الكلمات</span>
            </div>

            <div>
                <strong id="chars">0</strong>
                <span>الحروف</span>
            </div>

            <div>
                <strong id="noSpaces">0</strong>
                <span>بدون مسافات</span>
            </div>
        </div>

        <div class="buttons">
            <button id="copy">نسخ النص</button>
            <button id="clear">مسح</button>
        </div>
    </section>
</main>

<footer>
    أداتي © 2026
</footer>

<script src="app.js"></script>
</body>
</html>
